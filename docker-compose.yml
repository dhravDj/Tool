services:
  # ============================================================================
  # 1. PostgreSQL Relational Store
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: documind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-documind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documind_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-documind_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-documind} -d ${POSTGRES_DB:-documind_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - documind-net

  # ============================================================================
  # 2. Redis Cache & Job Broker
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: documind-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - documind-net

  # ============================================================================
  # 3. DocuMind FastAPI Backend Gateway
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: documind-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-documind}:${POSTGRES_PASSWORD:-documind_secure_password}@postgres:5432/${POSTGRES_DB:-documind_db}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-documind}:${POSTGRES_PASSWORD:-documind_secure_password}@postgres:5432/${POSTGRES_DB:-documind_db}
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_LOCAL_ROOT=/app/storage
    volumes:
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - documind-net

  # ============================================================================
  # 4. DocuMind React SPA Frontend
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: documind-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - documind-net

volumes:
  postgres_data:
    name: documind_postgres_data
  redis_data:
    name: documind_redis_data

networks:
  documind-net:
    name: documind-network
    driver: bridge
