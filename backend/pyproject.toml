[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "documind-backend"
version = "0.1.0"
description = "DocuMind AI — Universal File Intelligence Platform Backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.2",
    "redis>=5.0.8",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "python-magic>=0.4.27",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "striprtf>=0.0.26",
    "odfpy>=1.4.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "olefile>=0.47",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "xlwt>=1.3.0",
    "python-pptx>=1.0.0",
    "mutagen>=1.47.0",
    "soundfile>=0.12.0",
    "opencv-python-headless>=4.8.0",
    "sqlglot>=20.0.0",
    "pyarrow>=15.0.0",
    "py7zr>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "tests/fixtures",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
    "ARG001", # unused function argument (FastAPI lifespan, handlers)
    "ARG002", # unused method argument (interface overrides)
    "UP042",  # str, Enum inheritance
    "UP046",  # Generic[DataT] style
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "psycopg2.*",
    "redis.*",
    "fitz.*",
    "pymupdf.*",
    "docx.*",
    "striprtf.*",
    "odf.*",
    "ebooklib.*",
    "bs4.*",
    "pytesseract.*",
    "PIL.*",
    "yaml.*",
    "olefile.*",
    "defusedxml.*",
    "torch.*",
    "openpyxl.*",
    "xlrd.*",
    "xlwt.*",
    "pyarrow.*",
    "pptx.*",
    "mutagen.*",
    "soundfile.*",
    "pyannote.*",
    "faster_whisper.*",
    "cv2.*",
    "sqlglot.*",
    "py7zr.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
